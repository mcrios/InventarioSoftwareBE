spring.application.name=coreinventory
server.servlet.context-path=/coreinventory


# Credenciales de conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/coreinventory
spring.datasource.username=app
spring.datasource.password=IGF115
spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuracione del pool HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000


# Configuración de JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Access token: 24 horas (86400000 ms)
jwt.expiration=86400000
# Refresh token: 7 días (604800000 ms)
jwt.refresh-expiration=604800000

# --- CONFIGURACIÓN DE CORREO (SMTP) ---
# Por defecto apunta a un SMTP local tipo MailHog/Mailpit (sin autenticación).
# Para un proveedor real define MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD,
# MAIL_SMTP_AUTH y MAIL_SMTP_STARTTLS como variables de entorno.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:false}

# --- CONFIGURACIÓN DE ALERTAS POR CORREO ---
app.notificaciones.correo-habilitado=${NOTIFICACIONES_CORREO_HABILITADO:true}
app.notificaciones.remitente=${NOTIFICACIONES_REMITENTE:no-reply@coreinventory.com}
app.notificaciones.dias-aviso-vencimiento=${NOTIFICACIONES_DIAS_AVISO:30}
app.notificaciones.dias-entre-recordatorios=${NOTIFICACIONES_DIAS_RECORDATORIO:7}
app.notificaciones.incluir-administradores=${NOTIFICACIONES_INCLUIR_ADMINS:true}
app.notificaciones.cron=${NOTIFICACIONES_CRON:0 0 8 * * *}
app.notificaciones.zona-horaria=${NOTIFICACIONES_ZONA:America/El_Salvador}


# --- CONFIGURACIÓN DEL POOL DE TAREAS (Task Execution) ---
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=30
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=TaskExecutor-


# --- CONFIGURACIÓN DE LOGS (LOGBACK) ---

logging.level.sv.edu.ues.coreinventory=DEBUG
logging.level.org.springframework=INFO
#Logs especificos para transacciones SQL
logging.level.org.hibernate.SQL=INFO
# Ver los parámetros que se envían a las consultas SQL
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=[%clr(%5p)] %d{yyyy-MM-dd HH:mm:ss} %clr(${PID:- }){magenta} --- [%15.15t] %clr(%-40.40logger{36}){cyan} : %m%n

# (Opcional) Guardar los logs en un archivo físico además de la consola
logging.file.name=/home/mcruz/Apps/logs/core-inventory.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10
logging.pattern.file=%5p %d{yyyy-MM-dd HH:mm:ss.SSS} ${PID:- } --- [%t] %-40.40logger{36} : %m%n

spring.jpa.open-in-view=false