spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
logging.level.sv.edu.ues.coreinventory=DEBUG
logging.level.org.springframework=INFO
logging.file.name=${user.home}/Escritorio/proyecto-desarrollo-software/InventarioSoftwareBE/logs/core-inventory.log

# El correo se desactiva en pruebas para no depender de un SMTP real.
spring.mail.host=localhost
spring.mail.port=3025
app.notificaciones.correo-habilitado=false
